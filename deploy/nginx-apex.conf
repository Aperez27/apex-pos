# APEX — servidor de ejemplo para Nginx + PHP-FPM (Linux).
# Nginx no lee los archivos .htaccess: aquí se repiten las mismas reglas de seguridad.
#   sudo cp deploy/nginx-apex.conf /etc/nginx/sites-available/apex
#   sudo ln -s /etc/nginx/sites-available/apex /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name apex.tu-dominio.com;
    root /var/www/apex;
    index index.php;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Carpetas y archivos internos: nunca accesibles desde el navegador
    location ~ ^/(config|includes|logs|tests|deploy|docker|docs/fuente)(/|$) { return 403; }
    location ~ /\.                                      { return 403; }
    location ~* \.(sql|log|sh|md|ini|dist|yml|bak)$     { return 403; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # ajusta a tu versión de PHP
        fastcgi_hide_header X-Powered-By;
    }
}
