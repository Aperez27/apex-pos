# APEX — VirtualHost de ejemplo para Apache 2.4 en Linux (Ubuntu/Debian)
#   sudo cp deploy/apache-apex.conf /etc/apache2/sites-available/apex.conf
#   sudo a2enmod headers && sudo a2ensite apex && sudo systemctl reload apache2
# HTTPS con Let's Encrypt:
#   sudo apt install certbot python3-certbot-apache && sudo certbot --apache
<VirtualHost *:80>
    ServerName apex.tu-dominio.com
    DocumentRoot /var/www/apex

    # AllowOverride All es necesario: las reglas de seguridad están en los archivos .htaccess
    <Directory /var/www/apex>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/apex_error.log
    CustomLog ${APACHE_LOG_DIR}/apex_access.log combined
</VirtualHost>
